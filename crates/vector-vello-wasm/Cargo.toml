[package]
name = "lighttable-vector-vello-wasm"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "=0.3.103"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"
vello = { path = "../../.tools/vector-vello/vello-patched/vello", default-features = false, features = ["wgpu"] }
wgpu = { version = "=30.0.0", default-features = false, features = ["webgpu", "wgsl"] }

[workspace]

