<div id="cv-response-analysis">
  <div class="cv-section">
    <h3>Gemeten hue-respons bij middelmatige verzadiging</h3>
    <svg id="cv-hue-chart" role="img" aria-label="Gemeten chromaversterking per kleurhoek voor Photoshop Color and Vibrance Vibrance plus 100 en Saturation plus 100"></svg>
  </div>
  <div class="cv-section">
    <h3>Vibrance is een familie van verzadigingscurves</h3>
    <svg id="cv-saturation-chart" role="img" aria-label="Gemeten chromaversterking van Vibrance plus 100 bij vijf kleurhoeken en oplopende invoerverzadiging"></svg>
  </div>
  <div class="cv-section">
    <h3>Temperature en Tint op een neutrale grijsramp</h3>
    <div class="cv-two">
      <svg id="cv-temp-chart" role="img" aria-label="RGB-uitvoer voor Temperature plus 100 op een neutrale invoerramp"></svg>
      <svg id="cv-tint-chart" role="img" aria-label="RGB-uitvoer voor Tint plus 100 op een neutrale invoerramp"></svg>
    </div>
  </div>
</div>
<style>
  #cv-response-analysis { color: var(--foreground); display: grid; gap: 24px; width: 100%; }
  #cv-response-analysis .cv-section { min-width: 0; }
  #cv-response-analysis h3 { margin: 0 0 8px; font-weight: 500; }
  #cv-response-analysis svg { display: block; width: 100%; height: auto; overflow: visible; }
  #cv-response-analysis .cv-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  #cv-response-analysis .axis, #cv-response-analysis .grid { stroke: var(--border); vector-effect: non-scaling-stroke; }
  #cv-response-analysis .grid { opacity: .65; }
  #cv-response-analysis text { fill: var(--muted-foreground); font-size: 11px; }
  #cv-response-analysis .label { fill: var(--foreground); font-weight: 500; }
  #cv-response-analysis .skin-band { fill: var(--accent); opacity: .35; }
  #cv-response-analysis .line { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; }
  #cv-response-analysis .dot { stroke: var(--background); stroke-width: 1; vector-effect: non-scaling-stroke; }
  @media (max-width: 560px) { #cv-response-analysis .cv-two { grid-template-columns: 1fr; } }
</style>
<script>
(() => {

  const curveRows = {"20":[[0.1,2.1354],[0.2,1.8043],[0.3,1.6032],[0.4,1.5444],[0.5,1.448],[0.6,1.3753],[0.7,1.283],[0.8,1.1939],[0.9,1.1205]],"40":[[0.1,2.5303],[0.2,2.4161],[0.3,2.144],[0.4,1.9686],[0.5,1.6455],[0.6,1.4015],[0.7,1.2362],[0.8,1.1324],[0.9,1.0731]],"140":[[0.1,2.7473],[0.2,2.7417],[0.3,2.4125],[0.4,2.0704],[0.5,1.8266],[0.6,1.6267],[0.7,1.4477],[0.8,1.3179],[0.9,1.2243]],"220":[[0.1,2.7605],[0.2,2.814],[0.3,2.6263],[0.4,2.2309],[0.5,1.9475],[0.6,1.7528],[0.7,1.6043],[0.8,1.4904],[0.9,1.3618]],"310":[[0.1,2.5231],[0.2,2.5655],[0.3,2.3737],[0.4,2.0795],[0.5,1.685],[0.6,1.4201],[0.7,1.2467],[0.8,1.1384],[0.9,1.0747]]};

  const make = (tag, attrs = {}, text = '') => { const el = document.createElementNS(ns, tag); Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k, v)); if (text) el.textContent = text; return el; };
  const setup = (id, width, height) => { const svg = root.querySelector(id); svg.setAttribute('viewBox', `0 0 ${width} ${height}`); return svg; };
  const axes = (svg, box, xTicks, yTicks, xMap, yMap, xSuffix = '', ySuffix = '') => {
    yTicks.forEach(v => { const y=yMap(v); svg.append(make('line',{x1:box.l,y1:y,x2:box.r,y2:y,class:'grid'})); svg.append(make('text',{x:box.l-8,y:y+4,'text-anchor':'end'},`${v}${ySuffix}`)); });

  };
  const path = (rows, x, y) => rows.map((d,i)=>`${i?'L':'M'}${x(d[0]).toFixed(1)},${y(d[1]).toFixed(1)}`).join(' ');
  {

    svg.append(make('rect',{x:x(0),y:b.t,width:x(50)-x(0),height:b.b-b.t,class:'skin-band'}));
    svg.append(make('rect',{x:x(330),y:b.t,width:x(360)-x(330),height:b.b-b.t,class:'skin-band'}));

    [['v','Vibrance +100','var(--viz-series-1)'],['s','Saturation +100','var(--viz-series-2)']].forEach(([key,label,color],i)=>{ const rows=hueRows.map(d=>[d.h,d[key]]); svg.append(make('path',{d:path(rows,x,y),class:'line',stroke:color})); svg.append(make('text',{x:b.l+8,y:b.t+16+i*17,class:'label',fill:color},label)); });

  }
  {
    const svg=setup('#cv-saturation-chart',700,285),b={l:48,r:680,t:18,b:230},x=v=>b.l+((v-.1)/.8)*(b.r-b.l),y=v=>b.b-((v-1)/2)*(b.b-b.t);
    axes(svg,b,[.1,.3,.5,.7,.9],[1,1.5,2,2.5,3],x,y,'','×');
    const series=[['20','20° huid/oranje','var(--viz-series-1)'],['40','40° warm','var(--viz-series-2)'],['140','140° groen','var(--viz-series-3)'],['220','220° blauw','var(--viz-series-4)'],['310','310° magenta','var(--viz-series-5)']];
    series.forEach(([key,label,color],i)=>{ svg.append(make('path',{d:path(curveRows[key],x,y),class:'line',stroke:color})); const last=curveRows[key][8]; svg.append(make('text',{x:x(last[0])-2,y:y(last[1])+i*11-18,'text-anchor':'end',class:'label',fill:color},label)); });
    svg.append(make('text',{x:(b.l+b.r)/2,y:275,'text-anchor':'middle'},'HSV-invoerverzadiging')); svg.append(make('text',{x:14,y:(b.t+b.b)/2,transform:`rotate(-90 14 ${(b.t+b.b)/2})`,'text-anchor':'middle'},'OKLab-chromamultiplier'));
  }
  const rampChart = (id, rows, label) => {
    const svg=setup(id,340,300),b={l:42,r:326,t:24,b:250},x=v=>b.l+v/255*(b.r-b.l),y=v=>b.b-v/255*(b.b-b.t);

</script>
