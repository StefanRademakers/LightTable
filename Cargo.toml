[workspace]
members = ["crates/text-layout-wasm"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
wasm-bindgen = "=0.2.126"
read-fonts = "=0.42.1"
skrifa = "=0.45.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
