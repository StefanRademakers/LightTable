[workspace]
members = ["crates/text-layout-wasm"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
wasm-bindgen = "=0.2.126"
read-fonts = "=0.40.2"
skrifa = "=0.43.2"
zeno = "=0.3.3"
parley = { version = "=0.11.0", default-features = false, features = ["std", "complex-scripts"] }
fontique = { version = "=0.11.0", default-features = false, features = ["std"] }
icu_segmenter = { version = "=2.1.2", default-features = false, features = ["compiled_data"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
